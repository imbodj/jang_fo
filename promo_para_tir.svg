    <circle cx="-45" cy="-65" r="10" fill="#1A0B2E"/>
    <circle cx="55" cy="-65" r="10" fill="#1A0B2E"/>
    <path d="M-40,10 Q0,40 40,10" stroke="#FFF" stroke-width="8" fill="none" stroke-linecap="round"/>
