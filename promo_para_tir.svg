  <rect width="1080" height="1920" fill="url(#bg)"/>
  
  <text x="540" y="180" font-family="sans-serif" font-weight="900" font-size="70" fill="url(#gold)" text-anchor="middle">PARA TIR</text>
  <text x="540" y="240" font-family="sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF" text-anchor="middle">Développe ton agilité et ta précision !</text>

  <g transform="translate(540, 500)">
    <path d="M-200,-50 C-200,-150 0,-150 0,-50 Z" fill="#FF512F"/>
